name: Security & Race Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-race:
    name: Go Test with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Verify Module Integrity & Zero Dependencies
        run: |
          go mod tidy
          go mod verify
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "Error: go.mod or go.sum was modified during go mod tidy"
            exit 1
          fi

      - name: Run Static Analysis & Formatting
        run: |
          go vet ./...
          test -z "$(gofmt -s -l .)"

      - name: Run Race Detector Unit Tests
        run: |
          go test -v -race ./...

      - name: Test Single-Command Deterministic Build
        run: |
          go build -trimpath -ldflags="-buildid= -s -w" -o ./bin/zerotrust .
          ./bin/zerotrust --path ./tests/testdata/clean_package.json
